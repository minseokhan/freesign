name: Code Review

# PR에 대해 /review-code 스킬(security·correctness·architecture 3축 + verify)을 돌린다.
# ci.yml(lint·build·test)과 분리한 이유: 수명주기가 다르고, LLM 잡의 실패가
# 배포 게이트를 막아서는 안 된다.
#
# 커밋 전 1차 차단은 pre-commit 정적 스캐너(.githooks/pre-commit)가 담당한다.
# 여기서는 정적으로 못 잡는 판단형 결함만 본다.

on:
  pull_request:
    # draft에 푸시할 때마다 8분·$1.7짜리 리뷰를 태우지 않는다. draft를 벗는 순간
    # (ready_for_review) 한 번 돌고, 그 뒤 푸시(synchronize)부터 다시 따라붙는다.
    types: [opened, synchronize, ready_for_review]

# 같은 PR에 연속 푸시하면 이전 리뷰 런을 취소한다(토큰 낭비 방지).
concurrency:
  group: review-code-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # job-level `if`는 secrets 컨텍스트를 읽을 수 없다(허용: github·needs·vars·inputs).
  # secrets를 읽을 수 있는 step env로 판정해 job output으로 넘긴다. (ci.yml의 e2e-gate와 같은 패턴)
  gate:
    name: Check review preconditions
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # fork PR에는 시크릿이 주입되지 않는다.
          IS_SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # dependabot 등 봇 PR: 일반 시크릿이 없고, 액션 자체가 bot actor를 거부한다.
          # 제외하지 않으면 실패 알림만 쌓인다 (현재 이 레포의 열린 PR은 전부 dependabot).
          IS_BOT: ${{ endsWith(github.event.pull_request.user.login, '[bot]') }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN 시크릿이 없습니다 — 리뷰를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$IS_SAME_REPO" != "true" ]; then
            echo "fork PR이라 시크릿을 쓸 수 없습니다 — 리뷰를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$IS_BOT" = "true" ]; then
            echo "봇이 만든 PR입니다 — 리뷰를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$IS_DRAFT" = "true" ]; then
            echo "draft PR입니다 — ready로 바꾸면 리뷰합니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: /review-code
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    timeout-minutes: 20
    permissions:
      # contents는 read 그대로 둘 것. 머지 API(PUT /pulls/{n}/merge)는 contents: write를
      # 요구하므로, 이 권한이 read인 한 이 잡은 스스로 머지할 수 없다 — 자동 머지 금지의 하드 보장.
      contents: read
      pull-requests: write # 스킬이 인라인 리뷰를 게시한다 (read로는 부족)
      issues: read
      id-token: write # 액션의 기본 GitHub App 인증에 필요
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 스킬이 .claude/skills/review-code/ 를 읽어야 하므로 체크아웃이 선행되어야 한다.
          fetch-depth: 1

      # 스킬의 집계 CLI와 아래 심각도 게이트가 `node --experimental-strip-types`를 쓴다.
      # 러너 기본 node 버전에 맡기지 않고 ci.yml과 같은 22로 고정한다.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run /review-code
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        env:
          # 스킬은 Bash에서 `gh pr diff` · `gh api .../reviews` 를 쓴다.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 구독(Max) 인증. 팀이 생겨 조직 단위로 공유·과금 분리가 필요해지면
          # anthropic_api_key + ANTHROPIC_API_KEY 시크릿으로 바꾸면 된다.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 생략하면 액션이 Claude GitHub App으로 인증하려 하고, 앱이 설치돼 있지 않으면
          # "Claude Code is not installed on this repository"로 실패한다. 워크플로 토큰을
          # 직접 넘겨 앱 설치 없이 돌린다.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # --ci: 스킬이 Workflow 툴 대신 Task 서브에이전트를 쓰게 한다.
          # Workflow는 백그라운드라 헤드리스 런이 먼저 끝나 게시까지 못 간다.
          prompt: "/review-code ${{ github.event.pull_request.number }} --ci"
          # 기본은 출력을 가린다. 리뷰가 게시되지 않을 때 원인을 볼 수 없어 켜 둔다.
          # (private 레포 · 게시물은 소유자만 봄)
          show_full_output: "true"
          # 스킬에 allowed-tools frontmatter가 없으므로 필요한 툴을 여기서 명시한다.
          claude_args: |
            --max-turns 40
            --allowedTools "Bash,Read,Grep,Glob,Write,Task,Workflow"

      # 승인·차단은 LLM이 아니라 코드가 정한다. 스킬은 인라인 지적을 COMMENT로만 게시하고
      # 심각도 집계를 review-verdict.json에 남기며, 판정은 여기서 decideGate로 내린다.
      #   critical·major 0건 → APPROVE (머지는 하지 않음)
      #   하나라도 있으면    → REQUEST_CHANGES + exit 1 (체크 실패)
      # 리뷰 스텝이 실패·타임아웃해도 반드시 돌도록 always(). 판정 파일이 없으면 fail-closed로
      # 승인하지 않는다 — 즉 리뷰가 완주하지 못하면 승인은 절대 나오지 않는다.
      - name: Severity gate
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_VERDICT_PATH: review-verdict.json
        run: node --experimental-strip-types scripts/review-gate.mjs
