# 공개 취약점이 무기한 누적되지 않도록 주간 업데이트 + 보안 업데이트를 자동화한다.
# (OWASP 스캔 대시보드 #13·#14 — CI의 `npm audit --audit-level=high --omit=dev` 게이트와 짝)
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 패치·마이너는 한 PR로 묶어 리뷰 부담을 줄인다. 메이저는 개별 PR.
      minor-and-patch:
        update-types:
          - minor
          - patch

  # 액션은 SHA 핀으로 고정돼 있어 사람이 갱신하기 어렵다 — Dependabot이 SHA를 올린다.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
