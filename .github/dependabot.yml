# 공개 취약점이 무기한 누적되지 않도록 주간 업데이트 + 보안 업데이트를 자동화한다.
# (OWASP 스캔 대시보드 #13·#14 — CI의 `npm audit --audit-level=high --omit=dev` 게이트와 짝)
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 패치·마이너는 한 PR로 묶어 리뷰 부담을 줄인다. 메이저는 개별 PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # tailwind 4는 의존성 업데이트가 아니라 마이그레이션이다 — PostCSS 플러그인 분리,
      # `@tailwind` 지시자 교체, 기본값 변경(테두리 색·ring 두께·shadow 이름)이 화면에
      # 그대로 드러나고 커스텀 간격 토큰 사용처가 .tsx에 900곳 넘는다. 시각 회귀는 테스트로
      # 잡히지 않아 브라우저 확인이 함께 필요하다.
      # 지금 미루는 근거: 3.4는 npm에 `v3-lts` 태그로 유지되고(3.4.18·3.4.19가 v4 출시 이후
      # 릴리스), 보안 권고가 없다. 마이너·패치와 보안 업데이트는 이 규칙에 걸리지 않는다.
      # 마이그레이션을 하기로 하면 이 항목만 지우면 된다.
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major

  # 액션은 SHA 핀으로 고정돼 있어 사람이 갱신하기 어렵다 — Dependabot이 SHA를 올린다.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
